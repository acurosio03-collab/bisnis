<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TextMaster Pro - Generator & Pengubah Teks Cerdas</title>
    <meta name="description" content="Website AI online gratis untuk merapikan, mengembangkan, dan mengubah gaya tulisan secara instan menggunakan teknologi kecerdasan buatan.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Kotak Utama Aplikasi -->
    <div class="bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-xl border border-white/20">
        
        <!-- Header Judul -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">✨ AI TextMaster Pro</h1>
            <p class="text-slate-500 text-sm mt-1">Ubah dan kembangkan tulisanmu pakai kekuatan AI Gemini!</p>
        </div>

        <!-- Kolom Masukkan API Key Gemini (Opsional/Bisa diisi sendiri oleh user) -->
        <div class="mb-4 bg-indigo-50 p-3 rounded-xl border border-indigo-100">
            <label class="block text-xs font-semibold text-indigo-900 mb-1">Gemini API Key Kamu:</label>
            <input type="password" id="apiKey" placeholder="Tempel API Key Google AI Studio di sini..." class="w-full p-2 text-xs border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:outline-none bg-white">
            <p class="text-[10px] text-indigo-500 mt-1">Dapatkan key gratis di <a href="https://aistudio.google.com/" target="_blank" class="underline font-semibold">Google AI Studio</a></p>
        </div>

        <!-- Kotak Input Teks -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Topik / Teks Kamu:</label>
            <textarea id="inputText" rows="3" class="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-slate-800 placeholder-slate-400 text-sm transition shadow-sm" placeholder="Contoh: Buatkan ide konten TikTok tentang kopi..."></textarea>
        </div>

        <!-- Tombol-tombol Pilihan Fungsi (Termasuk AI) -->
        <div class="grid grid-cols-2 gap-2.5 mb-5">
            <button onclick="prosesAI('buat_caption')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5">
                ✨ Buat Caption AI
            </button>
            <button onclick="prosesAI('ringkas')" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5">
                📝 Ringkas Teks AI
            </button>
            <button onclick="ubahGaya('kapital')" class="bg-slate-700 hover:bg-slate-800 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition shadow-md">
                🔠 SEMUA KAPITAL
            </button>
            <button onclick="ubahGaya('estetik')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-3 rounded-xl text-xs transition shadow-md">
                🌟 Gaya Estetik
            </button>
        </div>

        <!-- Kotak Hasil Output -->
        <div class="mb-2">
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Hasil Output:</label>
                <button onclick="salinTeks()" id="btnSalin" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1 bg-indigo-50 px-2.5 py-1 rounded-lg transition">
                    📋 Salin Teks
                </button>
            </div>
            <div id="outputResult" class="w-full p-3.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-800 text-sm min-h-[100px] max-h-[180px] overflow-y-auto break-words select-all">
                Hasilnya akan muncul di sini...
            </div>
        </div>
    </div>

    <!-- Skrip Logika (Termasuk Koneksi ke Gemini API) -->
    <script>
        // Fungsi manual (tanpa AI)
        function ubahGaya(jenis) {
            let teks = document.getElementById('inputText').value;
            let hasilDiv = document.getElementById('outputResult');
            if (!teks.trim()) {
                hasilDiv.innerText = "⚠️ Masukkan teksnya terlebih dahulu!";
                return;
            }
            if (jenis === 'kapital') {
                hasilDiv.innerText = teks.toUpperCase();
            } else if (jenis === 'estetik') {
                hasilDiv.innerText = teks.split("").join("   ");
            }
        }

        // Fungsi Canggih Memanggil Gemini AI
        async function prosesAI(aksi) {
            let apiKey = document.getElementById('apiKey').value.trim();
            let teks = document.getElementById('inputText').value.trim();
            let hasilDiv = document.getElementById('outputResult');

            if (!apiKey) {
                alert("Masukkan Gemini API Key terlebih dahulu di kotak atas!");
                return;
            }
            if (!teks) {
                hasilDiv.innerText = "⚠️ Masukkan topik atau teksnya dulu ya!";
                return;
            }

            hasilDiv.innerText = "⏳ Sedang memproses dengan AI Gemini...";

            let promptUser = "";
            if (aksi === 'buat_caption') {
                promptUser = "Buatkan caption media sosial yang menarik dan profesional berdasarkan topik ini: " + teks;
            } else if (aksi === 'ringkas') {
                promptUser = "Ringkas dan rapikan teks berikut ini agar lebih enak dibaca: " + teks;
            }

            try {
                // Menggunakan model gemini-1.5-flash yang cepat dan efisien
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptUser }] }]
                    })
                });

                let data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    hasilDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    hasilDiv.innerText = "❌ Gagal memuat dari AI. Periksa kembali API Key kamu.";
                }
            } catch (error) {
                hasilDiv.innerText = "⚠️ Terjadi kesalahan jaringan atau API Key tidak valid.";
            }
        }

        function salinTeks() {
            let teksHasil = document.getElementById('outputResult').innerText;
            if (teksHasil.includes("Hasilnya") || teksHasil.includes("⚠️") || teksHasil.includes("⏳")) {
                alert("Belum ada hasil yang bisa disalin!");
                return;
            }
            navigator.clipboard.writeText(teksHasil);
            let btn = document.getElementById('btnSalin');
            btn.innerText = "✅ Berhasil Disalin!";
            setTimeout(() => { btn.innerText = "📋 Salin Teks"; }, 2000);
        }
    </script>
</body>
</html>

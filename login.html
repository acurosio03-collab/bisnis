<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | FU IYOH Kopitiam</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --wine-950: #4a0e13;
            --wine-900: #6b1620;
            --wine-800: #8a1f2b;
            --ember-500: #ef4444;
            --ember-600: #dc2626;
            --cream: #fff3e6;
            --cream-dim: #f0d0b8;
            --gold: #ffb648;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(ellipse 1000px 600px at 15% -5%, rgba(239,68,68,0.34), transparent 62%),
                radial-gradient(ellipse 800px 600px at 100% 15%, rgba(255,182,72,0.18), transparent 55%),
                linear-gradient(180deg, var(--wine-950) 0%, var(--wine-800) 45%, var(--wine-950) 100%);
            color: var(--cream);
        }

        .font-display { font-family: 'Fraunces', serif; }

        .glass-panel {
            background: linear-gradient(
                135deg,
                rgba(138,31,43,0.55) 0%,
                rgba(74,14,19,0.82) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(239,68,68,0.28);
        }

        .glow-effect {
            box-shadow:
                0 0 70px -20px rgba(239,68,68,0.50),
                0 25px 80px rgba(0,0,0,0.25);
        }

        .btn-primary {
            background: linear-gradient(120deg, var(--ember-500), var(--ember-600));
            box-shadow: 0 10px 35px -8px rgba(239,68,68,0.70);
        }

        .btn-primary:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }

        .input-field {
            width: 100%;
            background: rgba(107,22,32,0.70);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 1rem;
            padding: .9rem 1.25rem;
            color: white;
            outline: none;
            transition: .2s ease;
        }

        .input-field:focus {
            border-color: rgba(239,68,68,0.75);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
        }

        .input-field::placeholder {
            color: #c99a8c;
        }

        .shake {
            animation: shake .4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .fade-up {
            animation: fadeUp .6s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen antialiased flex items-center justify-center px-5 py-10 overflow-hidden">

    <!-- Background glow -->
    <div class="fixed -top-48 -left-32 w-[420px] h-[420px] rounded-full bg-red-500/20 blur-[100px] pointer-events-none"></div>
    <div class="fixed -bottom-48 -right-32 w-[420px] h-[420px] rounded-full bg-amber-400/10 blur-[100px] pointer-events-none"></div>

    <main class="w-full max-w-md relative z-10 fade-up">

        <!-- BRAND -->
        <div class="text-center mb-7">

            <div class="w-16 h-16 mx-auto rounded-[1.35rem]
                        bg-gradient-to-tr from-red-500 via-rose-600 to-[#6b1620]
                        flex items-center justify-center
                        shadow-xl shadow-red-600/40
                        border border-red-400/40 mb-4">

                <span class="text-white font-black text-3xl tracking-tighter font-display">
                    F
                </span>

            </div>

            <h1 class="font-display text-2xl sm:text-3xl font-black text-white tracking-tight">
                FU IYOH KOPITIAM
            </h1>

            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>

                <p class="text-[10px] tracking-[0.32em] text-red-300 uppercase font-bold">
                    Admin Control Panel
                </p>

                <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
            </div>

        </div>


        <!-- LOGIN CARD -->
        <div id="loginCard"
             class="glass-panel glow-effect rounded-[2rem] p-7 sm:p-9">

            <div class="text-center mb-8">

                <span class="inline-flex items-center justify-center
                             w-11 h-11 rounded-2xl
                             bg-red-500/10 border border-red-500/20
                             text-xl mb-4">
                    🔐
                </span>

                <h2 class="font-display text-2xl font-bold text-white">
                    Masuk ke Dashboard
                </h2>

                <p class="text-[#f0d0b8] text-xs mt-2 leading-relaxed">
                    Kelola menu, harga, dan pesanan
                    <br class="sm:hidden">
                    FU IYOH Kopitiam.
                </p>

            </div>


            <form id="formLogin" class="space-y-5">

                <!-- USERNAME -->
                <div class="space-y-2">

                    <label
                        for="inputUsername"
                        class="block text-xs font-bold text-[#ffe4cc] uppercase tracking-wider">
                        Username
                    </label>

                    <input
                        type="text"
                        id="inputUsername"
                        required
                        autocomplete="username"
                        class="input-field"
                        placeholder="Masukkan username">

                </div>


                <!-- PASSWORD -->
                <div class="space-y-2">

                    <label
                        for="inputPassword"
                        class="block text-xs font-bold text-[#ffe4cc] uppercase tracking-wider">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="inputPassword"
                            required
                            autocomplete="current-password"
                            class="input-field pr-20"
                            placeholder="Masukkan password">

                        <button
                            type="button"
                            id="btnLihatPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2
                                   text-[#c99a8c] hover:text-white
                                   text-[10px] font-bold tracking-wider">
                            LIHAT
                        </button>

                    </div>

                </div>


                <!-- ERROR -->
                <p
                    id="pesanError"
                    class="hidden text-red-300 text-xs font-semibold text-center
                           bg-red-500/10 border border-red-500/30
                           rounded-xl py-2.5 px-4">
                    Username atau password salah. Silakan coba lagi.
                </p>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="btn-primary w-full rounded-2xl py-4
                           flex items-center justify-center
                           text-sm font-black text-white tracking-wider
                           transition-all duration-200">
                    MASUK KE DASHBOARD
                </button>

            </form>

        </div>


        <!-- BACK TO WEBSITE -->
        <div class="text-center mt-6">

            <a
                href="index.html"
                class="inline-flex items-center gap-2
                       text-xs font-semibold text-[#f0d0b8]
                       hover:text-white transition tracking-wider">
                <span>←</span>
                Kembali ke Situs Utama
            </a>

        </div>


        <p class="text-center text-[9px] text-[#c99a8c] mt-8 opacity-70">
            FU IYOH Kopitiam • Internal Management System
        </p>

    </main>


    <script>

        /*
         * =========================================================
         * FU IYOH ADMIN LOGIN
         * =========================================================
         *
         * USERNAME : admin
         * PASSWORD : fuiyoh
         *
         * AUTH KEY HARUS SAMA DENGAN ADMIN-REVISI.HTML
         * =========================================================
         */

        const USERNAME_VALID = 'admin';
        const PASSWORD_VALID = 'fuiyoh';

        const AUTH_KEY = 'fuIyohAdminAuth';

        const DASHBOARD_PAGE = 'admin-revisi.html';


        const formLogin =
            document.getElementById('formLogin');

        const pesanError =
            document.getElementById('pesanError');

        const loginCard =
            document.getElementById('loginCard');


        /*
         * TOGGLE PASSWORD
         */
        document
            .getElementById('btnLihatPassword')
            .addEventListener('click', () => {

                const input =
                    document.getElementById('inputPassword');

                const button =
                    document.getElementById('btnLihatPassword');


                if (input.type === 'password') {

                    input.type = 'text';
                    button.textContent = 'SEMBUNYI';

                } else {

                    input.type = 'password';
                    button.textContent = 'LIHAT';

                }

            });


        /*
         * LOGIN
         */
        formLogin.addEventListener('submit', (event) => {

            event.preventDefault();


            const username =
                document
                    .getElementById('inputUsername')
                    .value
                    .trim();

            const password =
                document
                    .getElementById('inputPassword')
                    .value;


            /*
             * Username + password harus cocok.
             */
            if (
                username === USERNAME_VALID &&
                password === PASSWORD_VALID
            ) {

                /*
                 * INI YANG DIBACA ADMIN-REVISI.HTML
                 */
                sessionStorage.setItem(
                    AUTH_KEY,
                    'true'
                );


                /*
                 * Masuk ke dashboard revisi.
                 */
                window.location.href =
                    DASHBOARD_PAGE;


            } else {

                /*
                 * Tampilkan pesan error.
                 */
                pesanError.classList.remove('hidden');


                /*
                 * Efek shake pada card.
                 */
                loginCard.classList.remove('shake');

                void loginCard.offsetWidth;

                loginCard.classList.add('shake');

            }

        });


        /*
         * Jika masih memiliki session login,
         * jangan tampilkan login lagi.
         */
        if (
            sessionStorage.getItem(AUTH_KEY) === 'true'
        ) {

            window.location.href =
                DASHBOARD_PAGE;

        }

    </script>

</body>
</html>
